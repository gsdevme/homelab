apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  type: ExternalName
  externalName: home-assistant.lan
  # An ExternalName Service has no endpoints, so targetPort is meaningless:
  # Traefik dials the external host on the Service *port* itself. The port
  # therefore has to equal Home Assistant's real listener, 8123.
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-ingress
  annotations:
    # HTTP-01 issuer; its solver Ingress is also served by traefik-public.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Per-client rate limit (100 req/s, burst 400), defined in traefik-public
    # (infrastructure/base/traefik-public/values.yaml, where the numbers are
    # explained). Format is <namespace>-<middleware name>@kubernetescrd; the
    # reference crosses namespaces, which the Ingress provider allows while
    # providers.kubernetesIngress.crossProviderNamespaces is unset (setting
    # it without this namespace would make Traefik skip this whole Ingress).
    # This host is not behind Cloudflare, so the peer Traefik keys on is the
    # real client. If the app or a camera view starts getting 429s, raise
    # the numbers there rather than removing this.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-public-rate-limit@kubernetescrd
spec:
  # traefik-public is not the default IngressClass, so without this the
  # Ingress is served by nothing. Websockets (/api/websocket) need no
  # annotation on Traefik; upgrades are proxied by default.
  ingressClassName: traefik-public
  rules:
    - host: home-assistant.home.gsdev.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                # Must match the Service port above, which Traefik dials
                # directly on the ExternalName host.
                port:
                  number: 8123
  tls:
    - hosts:
        - home-assistant.home.gsdev.me
      secretName: home-assistant-home-gsdev-me-tls
