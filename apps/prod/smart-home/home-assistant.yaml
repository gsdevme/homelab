apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  type: ExternalName
  externalName: home-assistant.lan
  # An ExternalName Service has no endpoints, so each controller picks the
  # upstream port its own way: ingress-nginx dials targetPort (8123) behind
  # port 80, Traefik dials the Service port itself. Port 8123 therefore has to
  # exist as a Service port for Traefik. Both stay until the nginx Ingress is
  # retired, then this collapses to the single 8123 port. Multi-port Services
  # require every port to be named.
  ports:
    - name: http
      port: 80
      targetPort: 8123
    - name: http-8123
      port: 8123
      targetPort: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-ingress
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: home-assistant.home.gsdev.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 80
  tls:
    - hosts:
        - home-assistant.home.gsdev.me
      secretName: home-assistant-home-gsdev-me-tls
