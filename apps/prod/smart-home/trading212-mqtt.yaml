apiVersion: v1
kind: ConfigMap
metadata:
  name: trading212-mqtt
data:
  MODE: "live"
  MQTT_BROKER_URL: "mqtt://mqtt.home.gsdev.me:1883"
  HTTP_ADDR: ":8080"
  LOG_FORMAT: "json"
  # Empty = account device only, no per-position devices. To add positions, put
  # Trading 212 ticker IDs here (e.g. "AAPL_US_EQ,VUSA_EQ") — not the symbols the
  # app shows. Every poll logs `held=...` with the exact list ready to paste, and
  # the status page on :8080/ shows the same table (kubectl port-forward to read it).
  TICKERS: ""
  # defaults left unset: POLL_INTERVAL(5m), POLL_MAX_RETRIES(3),
  # READY_FAILURE_THRESHOLD(3), MQTT_CLIENT_ID(trading212-mqtt),
  # TOPIC_PREFIX(trading212), DISCOVERY_PREFIX(homeassistant), LOG_LEVEL(info).
  # Leave POLL_INTERVAL alone unless there's a reason: Trading 212 rate-limits per
  # *account*, not per key, so polling harder throttles the phone app too.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading212-mqtt
  labels:
    app: trading212-mqtt
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate, not RollingUpdate: two pods would briefly share MQTT_CLIENT_ID and
  # the broker would kick one of them off.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trading212-mqtt
  template:
    metadata:
      labels:
        app: trading212-mqtt
    spec:
      # Stateless — no token store, so nothing here needs the K8s API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
      containers:
        - name: trading212-mqtt
          image: ghcr.io/gsdevme/trading212-mqtt:v0.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: trading212-mqtt
            - secretRef:
                name: trading212-mqtt
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 10
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
