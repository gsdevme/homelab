apiVersion: v1
kind: ConfigMap
metadata:
  name: unifi-ha-presence
data:
  UNIFI_HOST: "https://172.16.16.1"
  MQTT_BROKER_URL: "mqtt://mqtt.home.gsdev.me:1883"
  TRACK_DEVICES: "Ceilidhs-Phone,iPhone-X"
  HEALTH_ADDR: ":8080"
  # defaults left unset: UNIFI_SITE(default), POLL_INTERVAL(10s), FAILURE_THRESHOLD(5),
  # READY_FAILURE_THRESHOLD(3), MQTT_TOPIC_PREFIX(unifi), HA_DISCOVERY_PREFIX(homeassistant),
  # LOG_LEVEL(info), LOG_FORMAT(json). ~50s to flip a device to not_home.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-ha-presence
  labels:
    app: unifi-ha-presence
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-ha-presence
  template:
    metadata:
      labels:
        app: unifi-ha-presence
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
      containers:
        - name: unifi-ha-presence
          image: ghcr.io/gsdevme/unifi-ha-presence-mqtt:v2.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: unifi-ha-presence
            - secretRef:
                name: unifi-ha-presence
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 10
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
