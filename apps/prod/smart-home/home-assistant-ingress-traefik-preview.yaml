# TEMPORARY preview of Home Assistant through traefik-public on its test ports
# (18080/18443) while ingress-nginx still serves 80/443. It is deleted when the
# real Ingress in home-assistant.yaml switches class to traefik-public; until
# then both Ingresses describe the same host and each controller serves only
# its own.
#
# Shape is final: what this Ingress says is what the real one will say, minus
# the cert-manager annotation. Websockets (/api/websocket) need no annotation
# on Traefik; upgrades are proxied by default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-ingress-traefik-preview
  # No cert-manager.io/cluster-issuer: the live Ingress already owns the
  # certificate, and a second issuer annotation would request a duplicate.
spec:
  ingressClassName: traefik-public
  rules:
    - host: home-assistant.home.gsdev.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                # Traefik dials an ExternalName backend on the Service *port*
                # (targetPort is meaningless without endpoints), so it needs
                # the port that equals Home Assistant's real listener.
                port:
                  number: 8123
  tls:
    - hosts:
        - home-assistant.home.gsdev.me
      # Reuse the certificate nginx serves today; cert-manager keeps renewing
      # it through the live Ingress.
      secretName: home-assistant-home-gsdev-me-tls
