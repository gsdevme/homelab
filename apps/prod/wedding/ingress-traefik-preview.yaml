# TEMPORARY preview of this site through traefik-public on its test ports
# (18080/18443) while ingress-nginx still serves 80/443. It is deleted when the
# real Ingress in deployment.yaml switches class to traefik-public; until then
# both Ingresses describe the same host and each controller serves only its own.
#
# Shape is final: what this Ingress says is what the real one will say, minus
# the cert-manager annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: wedding
  name: wedding-ingress-traefik-preview
  # No cert-manager.io/cluster-issuer: the live Ingress already owns the
  # certificate, and a second issuer annotation would request a duplicate.
spec:
  ingressClassName: traefik-public
  rules:
    - host: ceilidhandgavin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-wedding
                port:
                  number: 80
  tls:
    - hosts:
        - ceilidhandgavin.com
      # Reuse the certificate nginx serves today; cert-manager keeps renewing
      # it through the live Ingress.
      secretName: wedding-tls
