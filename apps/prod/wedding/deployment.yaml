apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding
  namespace: wedding
  labels:
    app: wedding
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: wedding
  template:
    metadata:
      labels:
        app: wedding
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/arch"
                    operator: In
                    values: ["amd64"]
      # Nothing in the pod talks to the API server.
      automountServiceAccountToken: false
      securityContext:
        # The nginx user in nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          imagePullPolicy: Always
          image: ghcr.io/gsdevme/wedding-website:prod
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp dirs under /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: wedding
  name: svc-wedding
spec:
  selector:
    app: wedding
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: wedding
  name: wedding-ingress
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: ceilidhandgavin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-wedding
                port:
                  number: 80
  tls:
    - hosts:
        - ceilidhandgavin.com
      secretName: wedding-tls
