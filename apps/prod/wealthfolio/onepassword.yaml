# Safe to commit: these carry vault/item *names* only, never values. The operator
# resolves them against the homelab vault and writes a Secret named after the CR.
#
# Deliberately two items, not one: traefik-private reads wealthfolio-basic-auth
# through the basic-auth Middleware to serve the ingress challenge, so keeping
# the app's encryption key out of that Secret means the ingress controller never
# reads it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: wealthfolio
spec:
  itemPath: "vaults/homelab/items/wealthfolio"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: wealthfolio-basic-auth
spec:
  itemPath: "vaults/homelab/items/wealthfolio-basic-auth"
