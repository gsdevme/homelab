# TEMPORARY: proves the Cloudflare dns-01 path end to end against Let's
# Encrypt's staging CA (no rate limits, untrusted cert) before the real Ingress
# moves to letsencrypt-prod-dns01. Nothing serves this Secret. Deleted together
# with the preview Ingress when wealthfolio switches to traefik-private.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wealthfolio-dns01-staging
spec:
  secretName: wealthfolio-dns01-staging-tls
  dnsNames:
    - wealthfolio.home.gsdev.me
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging-dns01
