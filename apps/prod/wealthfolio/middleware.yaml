# Basic auth in front of wealthfolio's own Argon2id login: two independent
# credentials, so scanners and any pre-auth bug in the app server never reach
# it. Attached to the Ingress with the router.middlewares annotation.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  annotations:
    # Kept by convention: in Traefik v3.7.20 the kubernetesCRD provider's
    # class filter applies only to IngressRoutes, so both Traefik instances
    # load this Middleware whatever its class.
    kubernetes.io/ingress.class: traefik-private
spec:
  basicAuth:
    # Written by the wealthfolio-basic-auth OnePasswordItem: a single key
    # holding one htpasswd line, which Traefik reads as the users list.
    secret: wealthfolio-basic-auth
    realm: Wealthfolio
