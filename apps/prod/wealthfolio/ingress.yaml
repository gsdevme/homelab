apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthfolio-ingress
  annotations:
    # dns-01 via Cloudflare: this host is only reachable on the LAN through
    # traefik-private, so an HTTP-01 challenge from Let's Encrypt could never
    # reach it.
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns01
    # Basic auth in front of wealthfolio's own Argon2id login. Format is
    # <namespace>-<middleware name>@kubernetescrd; see middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: wealthfolio-basic-auth@kubernetescrd
spec:
  # traefik-private is not the default IngressClass, so without this the
  # Ingress is served by nothing. It also keeps the public instance from ever
  # routing this host or loading its TLS secret.
  ingressClassName: traefik-private
  rules:
    - host: wealthfolio.home.gsdev.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wealthfolio
                port:
                  number: 8088
  tls:
    - hosts:
        - wealthfolio.home.gsdev.me
      secretName: wealthfolio-home-gsdev-me-tls
