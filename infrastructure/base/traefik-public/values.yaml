# Values for the traefik-public instance (chart traefik 42.4.3).
# Only non-default values are set; each says why.

deployment:
  # One pod on the node the router forwards to, binding hostPorts directly.
  # k3s servicelb is disabled, so a LoadBalancer Service would stay Pending.
  kind: DaemonSet
  revisionHistoryLimit: 2

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    # The chart default (maxSurge 1) deadlocks with hostPort: the surge pod
    # can never bind the port the old pod still holds. Replace in place.
    maxUnavailable: 1
    maxSurge: 0

# kube-master is the node the home router forwards 80/443 to.
nodeSelector:
  kubernetes.io/hostname: kube-master

# Traffic arrives on hostPorts; no Service is needed (and a LoadBalancer
# Service would never get an address with servicelb disabled).
service:
  enabled: false

ingressClass:
  enabled: true
  # Never default: every Ingress must opt in to public exposure explicitly.
  isDefaultClass: false
  name: traefik-public

providers:
  kubernetesIngress:
    enabled: true
    # Only serve Ingresses of this instance's class, so private hosts are
    # never routed (or their TLS secrets loaded) by the public instance.
    ingressClass: traefik-public
    # Home Assistant runs outside the cluster behind an ExternalName Service.
    allowExternalNameServices: true
    # No Service to copy status from; publish the node IP instead.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 172.16.16.17
  kubernetesCRD:
    enabled: true
    # Classless IngressRoutes must not go public; only IngressRoutes
    # annotated kubernetes.io/ingress.class: traefik-public are loaded.
    # Middlewares and TLSOptions are loaded whatever their class (see
    # extraObjects below).
    ingressClass: traefik-public
    # Only this namespace may define the cluster-wide default TLSOption/TLSStore.
    defaultTLSResourcesNamespace: traefik-public
    # Keep the classic <namespace>-<name>@kubernetescrd naming that the
    # entrypoint middleware references below rely on (also silences the
    # startup warning).
    safeNaming: false
  # No Gateway API use; also keeps the chart from rendering Gateway objects.
  kubernetesGateway:
    enabled: false

core:
  # Fail closed on conflicting TLS options. This sets no TLS version or
  # cipher (those are the `default` TLSOption in extraObjects below). TLS
  # options are chosen per host name (SNI), so when two routers serve the
  # same host on the same entrypoint with different options, Traefik by
  # default drops both mappings and quietly serves the host with `default`.
  # With this on, it instead marks every router of that host on that
  # entrypoint in error and does not build them, so the host stops being
  # served until the conflict is fixed, rather than silently losing a
  # stricter option ("Strict TLS Options" in the v3.7 TLS options docs).
  # A router with no Host in its rule (the catch-all below) on the default
  # options never conflicts. Trap: cert-manager's HTTP-01 solver Ingress
  # carries no TLS options, so it lands on websecure with `default`; a host
  # given a non-default option conflicts with it during every renewal (see
  # the `tls13` TLSOption below).
  strictTLSOptions: true

# No dashboard: nothing to expose or protect.
api:
  dashboard: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false
  # Applies to every entrypoint, the internal ones included. Request headers
  # whose name has any character outside A-Z, a-z, 0-9 and "-" (X_Forwarded_For,
  # X.Forwarded.For, ...) are removed before routing: some backends read such
  # a name as the dashed header it resembles, which lets a client spoof the
  # headers Traefik sets. `delete` rather than `reject` on purpose: reject
  # answers 400 ahead of the routers, so the request is never access-logged
  # (CrowdSec would not see it) and never reaches the bouncer.
  aliasHeadersStrategy: delete

ports:
  web:
    # Routers without explicit entrypoints attach only to web/websecure,
    # never to the internal traefik (8080) or metrics (9100) entrypoints.
    asDefault: true
    # Bound on the node itself (CNI portmap DNAT to the pod's 8000), so the
    # unprivileged container needs no NET_BIND_SERVICE.
    hostPort: 80
    http:
      # Same header cap and encoded-character filter as websecure; see the
      # comments there.
      maxHeaderBytes: 65536
      encodedCharacters:
        allowEncodedNullCharacter: false
        allowEncodedBackSlash: false
      # The bouncer runs before the redirect: Traefik implements the redirect
      # as an internal router on this entrypoint and prepends these
      # middlewares to it like to any other router, so a banned IP gets 403
      # here instead of a 301. No rate limit here: it is attached per router
      # instead (see the rate-limit Middleware below for why).
      middlewares:
        - traefik-public-crowdsec@kubernetescrd
      # Plain HTTP only ever redirects to HTTPS, permanently (301), so clients
      # and search engines remember the HTTPS URL.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    # Bound on the node itself (CNI portmap DNAT to the pod's 8443).
    hostPort: 443
    http:
      # Request line plus headers, in bytes (entrypoint `http.maxHeaderBytes`;
      # default 1048576). 64 KiB is well above anything a browser or the Home
      # Assistant app sends (Home Assistant itself refuses header lines over
      # about 24 KiB), and cuts the header memory one request can tie up
      # from 1 MiB to 64 KiB.
      # Go's HTTP server enforces it before any router runs: an oversized
      # request gets 431 with no access-log line and without meeting the
      # bouncer, so CrowdSec never sees these.
      maxHeaderBytes: 65536
      # Reject an encoded NUL (%00) or backslash (%5C) in the path; no app
      # here uses either, and both are classic path-traversal and
      # split-view tricks against backends that decode them. The other
      # encoded characters stay allowed (the default; `true` means allowed),
      # since %2F, %25 and friends are legitimate in URLs. Traefik answers
      # 400 with an empty body (pkg/server/router/deny.go). The check runs in
      # each router ahead of its middlewares, so even a banned IP gets 400
      # rather than 403. The 400 is access-logged on the app hosts and the
      # catch-all, but not on the web redirect: that router's service is
      # noop@internal and Traefik skips the access log for @internal
      # services unless accessLog.addInternals is on.
      encodedCharacters:
        allowEncodedNullCharacter: false
        allowEncodedBackSlash: false
      # Prepended to every router on this entrypoint, in this order. The
      # bouncer goes first so a banned IP is refused before anything else
      # runs. Then, for every host, br/gzip compression to cut transfer size
      # and HSTS so browsers refuse to downgrade to plain HTTP.
      # Entrypoint middlewares only run for requests that match a router;
      # the catch-all IngressRoute below makes every request match one.
      # The per-client rate limit is deliberately not in this list: it is
      # attached only to the routers whose peer address is the real client
      # (see the rate-limit Middleware below).
      middlewares:
        - traefik-public-crowdsec@kubernetescrd
        - traefik-public-compress@kubernetescrd
        - traefik-public-hsts@kubernetescrd

# CrowdSec reads this log to detect scanners: its agent tails this pod's
# container log and parses the default (CLF) access-log lines, including the
# 404s for unknown hosts and paths (logged under the catch-all router's name
# since that router exists; the parser accepts any router name). Turning the
# log off, filtering status codes out of it, or changing its format or fields
# stops detection without any error. So does renaming the release, since the
# agent finds the log by the traefik-public-* pod name
# (infrastructure/base/crowdsec/values.yaml).
accessLog:
  enabled: true

# CrowdSec bouncer: refuses IPs the CrowdSec local API (infrastructure/base/
# crowdsec) has banned, with 403, on both entrypoints. Stream mode: the
# plugin pulls the decision list every 60s and answers from memory, so no
# request waits on CrowdSec.
#
# Traefik downloads the plugin over the internet (its plugin catalog, which
# fetches it from GitHub) every time the pod starts. If that download fails,
# Traefik still starts but with plugins disabled: every router that carries
# the crowdsec middleware - all of them, through the entrypoint lists above -
# fails to build, so every request gets 404, the HTTP->HTTPS redirect
# included, until the pod is restarted with internet access.
#
# Unban: kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli decisions delete --ip <ip>
# (list with `cscli decisions list`; the plugin drops it on its next pull).
experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.2

# The bouncer's LAPI key, as the file /etc/traefik/crowdsec/key (read-only;
# the chart names the volume after the Secret). The Secret is written by the
# 1Password operator from crowdsec-bouncer-key.yaml. Deliberately not
# optional: the plugin refuses to start without the file, which would drop
# every router until the next restart, whereas a missing Secret on a
# required volume only holds the pod in ContainerCreating until the Secret
# appears. The plugin reads the key once at startup, so after rotating it
# restart this pod.
volumes:
  - name: crowdsec-bouncer-traefik
    mountPath: /etc/traefik/crowdsec
    type: secret

# Memory is 256Mi (not the 128Mi of traefik-private) because the bouncer
# plugin runs inside Traefik's process and keeps the ban list in memory.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 256Mi

# Middlewares, TLS options and the catch-all route. Each carries the class
# annotation. For the IngressRoute it is load-bearing: the kubernetesCRD
# provider's ingressClass filter skips IngressRoutes of another class. In
# v3.7.20 that filter is only applied to IngressRoute/IngressRouteTCP/
# IngressRouteUDP, not to Middlewares or TLSOptions (pkg/provider/kubernetes/
# crd: buildTLSOptions and the Middleware loop never check it), so
# traefik-private loads these too; harmless, because nothing it routes
# references them, and it ignores the `default` TLSOption below (its
# defaultTLSResourcesNamespace is traefik-private; it logs a warning).
# On Middlewares and TLSOptions the annotation is kept for consistency only.
# Because both instances load every Middleware and TLSOption, their
# <namespace>-<name> references must not collide across the two instances'
# namespaces.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: crowdsec
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      plugin:
        bouncer:
          enabled: true
          crowdsecMode: stream
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
          crowdsecLapiKeyFile: /etc/traefik/crowdsec/key
          # No WAF: only IP decisions are enforced (the chart's AppSec
          # component is off in infrastructure/base/crowdsec).
          crowdsecAppsecEnabled: false
          # Fail open. -1 means a failed pull never switches the plugin to
          # blocking everyone (the default, 0, does so on the first failure).
          # At startup it still waits for one pull (streamStartupBlock, up to
          # the 10s HTTP timeout) so known bans apply from the first request;
          # if that pull fails, traffic flows with an empty list and the next
          # pull 60s later retries. Bans already pulled keep being enforced
          # while the LAPI is down, until they expire.
          updateMaxFailure: -1
          streamStartupBlock: true
          # The hostPort traffic is DNATed straight to the pod (no
          # proxyProtocol), so the connection's peer address is whoever
          # opened the TCP connection to the router. For the Home Assistant
          # host and for unknown-host requests that is the real client. The
          # wedding host is proxied by Cloudflare, so there the peer is a
          # Cloudflare edge address shared by many visitors: the bouncer
          # cannot single out one wedding visitor, and CrowdSec's
          # cdn-whitelist postoverflow (installed with the traefik
          # collection) keeps Cloudflare's published ranges from ever being
          # banned, so scanners reaching that host through Cloudflare are
          # left to Cloudflare. Forwarded headers are deliberately not
          # trusted, Cloudflare's included.
          # Left empty, this list makes the plugin take the client from
          # X-Forwarded-For on every request, relying on the entrypoint
          # stripping a forged one. Listing only loopback (which no client
          # connects from) makes it always use the peer address, so a client
          # cannot dodge a ban, or get someone else banned, with a forged
          # header.
          forwardedHeadersTrustedIPs:
            - 127.0.0.1/32
  # The catch-all route and its 404. Entrypoint middlewares only run for
  # requests that match a router, so without a catch-all a banned IP asking
  # for an unknown host would still get Traefik's 404 instead of 403. This
  # route matches every HTTPS request that no real router does (priority 1;
  # other routers default to the length of their rule, so any real Host rule
  # outranks it), so the bouncer runs first; everyone it lets through then
  # gets 404 from not-found, as before.
  # CrowdSec's probing scenarios count those 404s, so they must stay 404.
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: not-found
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      # Built-in Traefik has no "always answer 404" middleware, so this is an
      # allow-list nothing on the internet can pass (loopback only, matched
      # against the connection's peer address) that answers 404 when it
      # refuses.
      ipAllowList:
        sourceRange:
          - 127.0.0.1/32
        rejectStatusCode: 404
  # Backend placeholder for the catch-all route: no selector, so it never has
  # endpoints (the provider's allowEmptyServices, a chart default, lets the
  # router build anyway; it would answer 503 if anything ever reached it).
  - apiVersion: v1
    kind: Service
    metadata:
      name: catch-all-unreachable
      namespace: traefik-public
    spec:
      ports:
        - port: 80
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: catch-all
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      # HTTPS only: on web the redirect router already matches every
      # request that has a Host header.
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: PathPrefix(`/`)
          priority: 1
          # Rate limit first (unknown-host requests arrive directly, so the
          # peer is the client), then the 404. A flood of unknown-host
          # requests gets 429s, which are access-logged under this router
          # like the 404s.
          middlewares:
            - name: rate-limit
            - name: not-found
          # Never reached (not-found refuses every client). It must still be
          # an ordinary Service and not Traefik's built-in noop@internal:
          # Traefik leaves routers whose service ends in @internal out of
          # the access log (unless accessLog.addInternals is set), and
          # CrowdSec needs these 404s logged.
          services:
            - name: catch-all-unreachable
              port: 80
      # Traefik's default certificate, as unknown hosts got before.
      tls: {}
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: compress
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      compress:
        encodings:
          - br
          - gzip
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: hsts
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
  # Per-client rate limit, attached per router, not on the entrypoints:
  # - the Home Assistant Ingress (apps/prod/smart-home/home-assistant.yaml,
  #   router.middlewares: traefik-public-rate-limit@kubernetescrd; the
  #   Ingress provider allows the cross-namespace reference because
  #   providers.kubernetesIngress.crossProviderNamespaces is unset);
  # - the catch-all IngressRoute above, ahead of not-found.
  # Both see the real client as the TCP peer. It is kept off the entrypoints
  # because the wedding host is proxied by Cloudflare: its peer is a
  # Cloudflare edge address shared by many visitors, so one noisy client
  # would get everyone behind the same edge 429s. Abuse of that host is left
  # to Cloudflare.
  # A token bucket per peer IP: refills at 100 requests/s and holds 400.
  # The numbers are sized for Home Assistant, whose frontend cold load
  # fetches a few hundred assets at once and whose camera views (HLS
  # segments, snapshots) burst on top of that; only a sustained flood is
  # refused. A request that would wait more than 5ms (half of 1/100s) for a
  # token gets 429 with Retry-After instead; shorter waits are absorbed as a
  # delay. A websocket or long stream costs one token for its whole life, so
  # it is never cut. 429s are access-logged under the router's name (the
  # Home Assistant router and the catch-all both have real services), so
  # after a rollout watch the access log for 429s on the Home Assistant host
  # and raise the numbers if a legitimate client hits them.
  # Traefik builds a middleware once per router that references it, so each
  # router keeps its own buckets: the limit is per client per router (in
  # practice per host and entrypoint), not across the whole instance, and
  # Home Assistant and the catch-all never share a bucket. Buckets live in
  # this pod's memory and reset on restart.
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: rate-limit
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      rateLimit:
        average: 100
        period: 1s
        burst: 400
        # Key the buckets by the connection's peer address. An ipStrategy
        # with depth 0 and no excludedIPs is Traefik's RemoteAddr strategy
        # (pkg/config/dynamic IPStrategy.Get): the IP of the TCP peer,
        # X-Forwarded-For never read. depth > 0 or any excludedIPs would
        # switch to picking an address out of X-Forwarded-For, which a client
        # controls. The hostPort traffic is DNATed straight to the pod (no
        # proxyProtocol), so on the two routers this is attached to (Home
        # Assistant, unknown hosts) the peer is the client; on the
        # Cloudflare-proxied wedding host it would be a shared edge address,
        # which is why it is not attached there.
        # Leaving sourceCriterion out gives the same strategy today; it is
        # spelled out so a later edit cannot drift to a header.
        sourceCriterion:
          ipStrategy:
            depth: 0
  # The instance-wide default TLS options: every TLS router without its own
  # options, the catch-all included. Must be named `default` and live in
  # traefik-public (providers.kubernetesCRD.defaultTLSResourcesNamespace);
  # elsewhere Traefik ignores it with a warning and falls back to its
  # built-in defaults (TLS 1.2+, Go's whole "secure" cipher list, which
  # includes CBC suites).
  # TLS 1.2 is the floor (TLS 1.0/1.1 never negotiate), and for TLS 1.2
  # only forward-secret AEAD suites: ECDHE key exchange with AES-GCM or
  # ChaCha20-Poly1305. That drops the CBC-SHA suites and the static-RSA key
  # exchange. TLS 1.3 suites are not configurable in Go and are all AEAD.
  # The certificates here are RSA (cert-manager's default), so the ECDHE_RSA
  # suites are the ones used; the ECDSA ones cost nothing and keep an ECDSA
  # certificate working.
  # Deliberately no sniStrict: with it a client that sends no SNI or an
  # unknown host name fails the TLS handshake, which never reaches HTTP and
  # leaves no access-log line, so the unknown-host scans CrowdSec counts as
  # 404s would vanish. Unknown hosts get Traefik's default certificate and
  # then the catch-all's 404 instead.
  - apiVersion: traefik.io/v1alpha1
    kind: TLSOption
    metadata:
      name: default
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  # TLS 1.3 only, for a host to opt into with the Ingress annotation
  # traefik.ingress.kubernetes.io/router.tls.options:
  # traefik-public-tls13@kubernetescrd. A TLS 1.2 client then fails the
  # handshake (protocol_version alert) and, like any handshake failure,
  # leaves no access-log line.
  # Nothing references it yet, and an HTTP-01 host cannot simply opt in:
  # the HTTP-01 challenge on port 80 is redirected to HTTPS and served on
  # websecure by cert-manager's solver Ingress, which carries no TLS options
  # and so uses `default`. That is a conflict for the host, and with
  # core.strictTLSOptions every websecure router of the host, the app's and
  # the solver's, is disabled for as long as the solver Ingress exists: the
  # host goes down and its certificate cannot renew. The solver Ingresses
  # have to carry the same option, or be kept off websecure, first (both
  # are set on the ClusterIssuer in infrastructure/base/letsencrypt/).
  - apiVersion: traefik.io/v1alpha1
    kind: TLSOption
    metadata:
      name: tls13
      namespace: traefik-public
      annotations:
        kubernetes.io/ingress.class: traefik-public
    spec:
      minVersion: VersionTLS13
