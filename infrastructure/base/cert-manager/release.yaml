apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: "1.20.3"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    # v1.15+ replaced `installCRDs` with the `crds` block. keep=true retains the
    # CRDs (and issued certs) if the release is ever removed.
    crds:
      enabled: true
      keep: true
    # DNS-01 self-check: before asking Let's Encrypt to validate, cert-manager
    # looks up the _acme-challenge TXT record itself. The LAN resolver overrides
    # private hosts locally, so going through it (or following its answers to
    # the authoritative servers) can give a split-horizon view and stall the
    # challenge. Ask public recursive resolvers only.
    dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
    dns01RecursiveNameserversOnly: true
